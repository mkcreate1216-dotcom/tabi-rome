<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="たびろーむ ロゴ">
  <defs>
    <linearGradient id="tabirome-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tabirome-pin" x1="34" y1="12" x2="50" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- クレイ風角丸ベース -->
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#tabirome-bg)" />
  <rect x="5" y="5" width="54" height="54" rx="17" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" />

  <!-- 道草ルート（S字の旅路） -->
  <path
    d="M17 47C17 38 29 41 29 32C29 24 42 27 42 19"
    stroke="#94a3b8"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="1 6"
  />
  <path
    d="M17 47C17 38 29 41 29 32C29 24 42 27 42 19"
    stroke="#f8fafc"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- 出発地点ドット -->
  <circle cx="17" cy="47" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="2" />

  <!-- 寄り道スポットドット -->
  <circle cx="29" cy="32" r="3.5" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />

  <!-- 目的地マップピン -->
  <path
    d="M42 11C36.75 11 32.5 15.25 32.5 20.5C32.5 27.2 42 35.5 42 35.5C42 35.5 51.5 27.2 51.5 20.5C51.5 15.25 47.25 11 42 11Z"
    fill="url(#tabirome-pin)"
  />
  <circle cx="42" cy="20.5" r="3.5" fill="#0f172a" />
</svg>

